name: Import verified V4 source
on:
  push:
    branches: [feat/v4-sdk-custom-scoring]
permissions:
  contents: write
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-sdk-custom-scoring
      - name: Import tested source changes
        if: hashFiles('v4-payload.b64') != ''
        run: |
          set -euo pipefail
          base64 -d v4-payload.b64 | tar -xz
          git rm -f v4-payload.b64
          git add -A
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "feat(v4): public SDK and custom scorer support"
          git push origin HEAD:feat/v4-sdk-custom-scoring
