name: Import verified V5 source
on:
  push:
    branches: [feat/v5-history-inspection]
permissions:
  contents: write
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v5-history-inspection
      - name: Import tested source changes
        if: hashFiles('v5-payload.b64') != ''
        run: |
          set -euo pipefail
          base64 -d v5-payload.b64 | tar -xz
          git rm -f v5-payload.b64
          git add -A
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "feat(v5): read-only verified historical inspection"
          git push origin HEAD:feat/v5-history-inspection
